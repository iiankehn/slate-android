name: Android CI

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify debug build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify target architectures
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          native_entries=$(unzip -Z1 "$apk" | grep '^lib/.*/.*\.so$' || true)
          if [ -n "$native_entries" ]; then
            printf '%s\n' "$native_entries" | grep -q '^lib/arm64-v8a/'
            printf '%s\n' "$native_entries" | grep -q '^lib/x86_64/'
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: slate-unified-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-smoke-test:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device:
          - name: android-12-phone
            api-level: 31
            size: 1080x1920
            density: 420
          - name: large-screen
            api-level: 35
            size: 1600x1000
            density: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Slate on ${{ matrix.device.name }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.device.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/run-emulator-tests.sh ${{ matrix.device.name }} ${{ matrix.device.size }} ${{ matrix.device.density }}
      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: slate-emulator-results-${{ matrix.device.name }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/emulator/
          if-no-files-found: warn
