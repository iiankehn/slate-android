name: Bootstrap Slate

on:
  push:
    paths:
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore Slate foundation
        env:
          ARCHIVE: 
        run: |
          printf '%s' "$ARCHIVE" | base64 --decode > /tmp/slate.tar.gz
          tar -xzf /tmp/slate.tar.gz
          rm .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Slate Android foundation"
          git push
