name: Apply Slate polish

on:
  push:
    paths:
      - .github/workflows/polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply Material polish and launcher icon
        run: |
          base64 --decode polish-payload.txt > /tmp/slate-polish.tar.gz
          tar -xzf /tmp/slate-polish.tar.gz
          rm polish-payload.txt
          rm .github/workflows/polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Slate UI and launcher icon"
          git push
