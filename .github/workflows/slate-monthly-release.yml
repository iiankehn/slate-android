name: Slate Monthly Release

on:
  schedule:
    - cron: "0 15 1 * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish instead of leaving a draft
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SLATE_KEY_ALIAS: ${{ secrets.SLATE_R1_KEY_ALIAS }}
      SLATE_KEYSTORE_PASSWORD: ${{ secrets.SLATE_R1_KEYSTORE_PASSWORD }}
      SLATE_KEY_PASSWORD: ${{ secrets.SLATE_R1_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: ${{ secrets.SLATE_R1_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set release identifiers
        run: |
          echo "SLATE_VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "RELEASE_MONTH=$(date -u +%Y-%m)" >> "$GITHUB_ENV"
          echo "SLATE_VERSION_NAME=$(date -u +%Y.%m)+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SLATE_R1_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/slate.jks"
          echo "SLATE_KEYSTORE_PATH=$RUNNER_TEMP/slate.jks" >> "$GITHUB_ENV"
      - name: Verify and build Slate
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Verify signed release identity and architectures
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null

          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"

          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apksigner.txt"
          actual_package=$("$build_tools/aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          test "$actual_package" = "com.iiankehn.slate"

          actual_cert=$(awk -F': ' '/certificate SHA-256 digest/ {print tolower($2); exit}' "$RUNNER_TEMP/apksigner.txt" | tr -d ':')
          test -n "$actual_cert"
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            expected_cert=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')
            test "$actual_cert" = "$expected_cert"
          fi

          native_entries=$(unzip -Z1 "$apk" | grep '^lib/.*/.*\.so$' || true)
          if [ -n "$native_entries" ]; then
            printf '%s\n' "$native_entries" | grep -q '^lib/arm64-v8a/'
            printf '%s\n' "$native_entries" | grep -q '^lib/x86_64/'
          fi

          {
            echo "### Verified release identity"
            echo "- Package: \`$actual_package\`"
            echo "- Signing certificate SHA-256: \`$actual_cert\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/Slate-${RELEASE_MONTH}.apk"
          cd release
          sha256sum "Slate-${RELEASE_MONTH}.apk" > "Slate-${RELEASE_MONTH}.apk.sha256"
          apk_sha=$(cut -d ' ' -f 1 "Slate-${RELEASE_MONTH}.apk.sha256")
          apk_size=$(stat -c '%s' "Slate-${RELEASE_MONTH}.apk")
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"https://github.com/iiankehn/slate-android/releases/download/slate-%s/Slate-%s.apk","sha256":"%s","sizeBytes":%s}\n' \
            "$SLATE_VERSION_CODE" "$SLATE_VERSION_NAME" "$RELEASE_MONTH" "$RELEASE_MONTH" "$apk_sha" "$apk_size" \
            > slate-update.json
          notes_file="docs/releases/${RELEASE_MONTH}.md"
          if [ ! -f "../$notes_file" ]; then notes_file="RELEASE_NOTES.md"; fi
          echo "RELEASE_NOTES_FILE=$notes_file" >> "$GITHUB_ENV"
      - name: Upload signed release candidate
        uses: actions/upload-artifact@v5
        with:
          name: slate-signed-release-candidate
          path: release/
          if-no-files-found: error
      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          tag="slate-${RELEASE_MONTH}"
          title="Slate — ${RELEASE_MONTH}"
          if gh release view "$tag" >/dev/null 2>&1; then
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" -X PATCH -f sha="$GITHUB_SHA" -F force=true >/dev/null
            fi
            gh release upload "$tag" release/* --clobber
            if [ "$PUBLISH" = "true" ]; then
              gh release edit "$tag" --draft=false --title "$title" --notes-file "$RELEASE_NOTES_FILE"
            else
              gh release edit "$tag" --draft=true --title "$title" --notes-file "$RELEASE_NOTES_FILE"
            fi
          else
            args=(--title "$title" --target "$GITHUB_SHA" --notes-file "$RELEASE_NOTES_FILE")
            if [ "$PUBLISH" != "true" ]; then args+=(--draft); fi
            gh release create "$tag" release/* "${args[@]}"
          fi
