name: Slate Monthly Release

on:
  schedule:
    - cron: "0 15 1 * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish instead of leaving a draft
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SLATE_KEY_ALIAS: ${{ secrets.SLATE_R1_KEY_ALIAS }}
      SLATE_KEYSTORE_PASSWORD: ${{ secrets.SLATE_R1_KEYSTORE_PASSWORD }}
      SLATE_KEY_PASSWORD: ${{ secrets.SLATE_R1_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set release identifiers
        run: |
          echo "SLATE_VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "RELEASE_MONTH=$(date -u +%Y-%m)" >> "$GITHUB_ENV"
          echo "SLATE_VERSION_NAME=$(date -u +%Y.%m)+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SLATE_R1_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/slate.jks"
          echo "SLATE_KEYSTORE_PATH=$RUNNER_TEMP/slate.jks" >> "$GITHUB_ENV"
      - name: Verify and build Slate
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Prepare release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/Slate-${RELEASE_MONTH}.apk"
          cd release
          sha256sum "Slate-${RELEASE_MONTH}.apk" > "Slate-${RELEASE_MONTH}.apk.sha256"
          apk_sha=$(cut -d ' ' -f 1 "Slate-${RELEASE_MONTH}.apk.sha256")
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"https://github.com/iiankehn/slate-android/releases/download/slate-%s/Slate-%s.apk","sha256":"%s"}\n' \
            "$SLATE_VERSION_CODE" "$SLATE_VERSION_NAME" "$RELEASE_MONTH" "$RELEASE_MONTH" "$apk_sha" \
            > slate-update.json
      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          tag="slate-${RELEASE_MONTH}"
          title="Slate — ${RELEASE_MONTH}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            if [ "$PUBLISH" = "true" ]; then
              gh release edit "$tag" --draft=false --title "$title"
            else
              gh release edit "$tag" --draft=true --title "$title"
            fi
          else
            args=(--title "$title" --generate-notes)
            if [ "$PUBLISH" != "true" ]; then args+=(--draft); fi
            gh release create "$tag" release/* "${args[@]}"
          fi
